databases:
  - name: vgram-db
    plan: basic-256mb
    databaseName: vgram
    user: vgram

services:
  - type: web
    name: vgram-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vgram-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
