# Apply VGRAM colors to the actual Telegram application on launch.
          launch = root / "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
          launch_source = launch.read_text(encoding="utf-8")

          theme_hook = "VgramTheme.apply(this);"

          if theme_hook not in launch_source:
              # Telegram may declare onCreate as either public or protected.
              # Match the method declaration first, then find its super call.
              on_create_pattern = (
                  r'((?:public|protected)\s+void\s+onCreate\s*'
                  r'\(\s*Bundle\s+savedInstanceState\s*\)\s*\{)'
              )

              method_match = re.search(on_create_pattern, launch_source)

              if not method_match:
                  raise SystemExit(
                      "VGRAM theme integration failed: "
                      "LaunchActivity.onCreate(Bundle) was not found."
                  )

              method_start = method_match.end()
              method_body = launch_source[method_start:]

              # Find the first super.onCreate(savedInstanceState) call
              # within the onCreate method.
              super_pattern = r'super\s*\.\s*onCreate\s*\(\s*savedInstanceState\s*\)\s*;'
              super_match = re.search(super_pattern, method_body)

              if not super_match:
                  raise SystemExit(
                      "VGRAM theme integration failed: "
                      "super.onCreate(savedInstanceState) was not found."
                  )

              insert_at = method_start + super_match.end()

              launch_source = (
                  launch_source[:insert_at]
                  + "\n        VgramTheme.apply(this);"
                  + launch_source[insert_at:]
              )

              launch.write_text(launch_source, encoding="utf-8")
              print("Applied VGRAM theme hook to LaunchActivity.onCreate.")

          else:
              print("VGRAM launch theme hook already present.")
