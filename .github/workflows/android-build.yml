          import json
          google_services = root / "TMessagesProj_App/google-services.json"
          if google_services.is_file():
              google_data = json.loads(google_services.read_text(encoding="utf-8"))
              clients = google_data.get("client", [])
              template = next((x for x in clients if x.get("client_info", {}).get("android_client_info", {}).get("package_name") in ("org.telegram.messenger", "org.telegram.messenger.beta")), None)
              if template is None:
                  raise SystemExit("VGRAM build patch failed: no upstream Firebase client template found")
              for package_name in ("org.vgram.messenger", "org.vgram.messenger.beta"):
                  existing = next((x for x in clients if x.get("client_info", {}).get("android_client_info", {}).get("package_name") == package_name), None)
                  if existing is None:
                      cloned = json.loads(json.dumps(template))
                      cloned["client_info"]["android_client_info"]["package_name"] = package_name
                      clients.append(cloned)
              google_data["client"] = clients
              google_services.write_text(json.dumps(google_data, indent=2) + "\n", encoding="utf-8")
          # CI memory limit is smaller than a developer workstation.
          text = re.sub(r'(?m)^org.gradle.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8', text)
          props.write_text(text, encoding="utf-8")

          buildvars = root / "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          text = buildvars.read_text(encoding="utf-8")
          # VgramApiDiagnostics.java is committed; only per-build credentials are injected into BuildVars.

          text = re.sub(r'public static boolean CHECK_UPDATES = true;', 'public static boolean CHECK_UPDATES = false;', text, count=1)
          api_id = os.environ.get("TG_API_ID", "").strip()
          api_hash = os.environ.get("TG_API_HASH", "").strip()
          if api_id and api_hash:
              if not api_id.isdigit():
                  raise SystemExit("TG_API_ID must contain digits only")
              text = re.sub(r'public static int APP_ID = \d+;', f'public static int APP_ID = {api_id};', text, count=1)
              text = re.sub(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{api_hash}";', text, count=1)
          else:
              print("WARNING: TG_API_ID/TG_API_HASH secrets not both set; upstream development API values remain. Configure your own values before distribution.")
          buildvars.write_text(text, encoding="utf-8")

          # The APK is built from a clean upstream checkout, so patch the upstream
          # synchronous Premium gate here rather than relying on an unoverlaid source file.
          user_config = root / "TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java"
          text = user_config.read_text(encoding="utf-8")
          pattern = r"(?m)^    public boolean isPremium\(\) \{\n        TLRPC\.User user = currentUser;\n        if \(user == null\) \{\n            return false;\n        \}\n        return user\.premium;\n    }"
          replacement = """    public boolean isPremium() {
                  TLRPC.User user = currentUser;
                  if (user == null) {
                      return false;
                  }
                  return VgramPremiumManager.isPremium(ApplicationLoader.applicationContext, user.id, user.premium);
              }"""
          text, patched = re.subn(pattern, lambda _match: replacement, text, count=1)
          if patched != 1:
              raise SystemExit("VGRAM Premium patch failed: UserConfig.isPremium() signature/body changed upstream")
          user_config.write_text(text, encoding="utf-8")
          print("Patched UserConfig.isPremium() to combine Telegram Premium with cached VGRAM Premium.")
          PY

