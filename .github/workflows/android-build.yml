          text = re.sub(r"(?m)^APP_VERSION_CODE=.*$", "APP_VERSION_CODE=" + run_number, text)
          text = re.sub(r"(?m)^APP_VERSION_NAME=.*$", "APP_VERSION_NAME=" + version_name, text)
          text = re.sub(r"(?m)^APP_PACKAGE=.*$", "APP_PACKAGE=org.vgram.messenger", text)
          # Firebase's Google Services Gradle plugin requires a client entry for each
