          resume_match = re.search(r'((?:public|protected)\s+void\s+onResume\s*\(\s*\)\s*\{[\s\S]*?super\.onResume\(\)\s*;)', launch_source)
          if resume_match:
              resume_body = resume_match.group(1)
              if "VgramTheme.apply(this);" not in resume_body:
                  launch_source = launch_source[:resume_match.end(1)] + "\n        VgramTheme.apply(this);" + launch_source[resume_match.end(1):]
