name: VGRAM Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "README.md"
      - "VGRAM_FEATURES.md"
      - "PLUGIN_API.md"
      - "VGRAM_ICON.png"

permissions:
  contents: read

concurrency:
  group: vgram-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fetch Telegram source and build VGRAM
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout VGRAM build configuration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch clean Telegram Android source
        run: |
          git clone --recursive --shallow-submodules --depth 1 https://github.com/DrKLO/Telegram.git upstream
          cd upstream
          git rev-parse HEAD | tee ../upstream-telegram-commit.txt

      - name: Apply VGRAM bootstrap branding
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path("upstream")
          strings = root / "TMessagesProj/src/main/res/values/strings.xml"
          text = strings.read_text(encoding="utf-8")
          text = re.sub(r'(<string\s+name="AppName">).*?(</string>)', r'\1VGRAM\2', text, count=1)
          text = re.sub(r'(<string\s+name="AppNameBeta">).*?(</string>)', r'\1VGRAM Beta\2', text, count=1)
          strings.write_text(text, encoding="utf-8")

          # Generate four transparent VGRAM character-style badge assets in the build tree.
          # SVG vector art is kept inside this single workflow file; no extra repository files needed.
          drawable = root / "TMessagesProj/src/main/res/drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          badge_specs = {
              "vgram_badge_n": ("N", "#D8DCE8", "#F2C94C", "M18 12 L30 28 L30 12"),
              "vgram_badge_v": ("V", "#D8DCE8", "#F2C94C", "M13 13 L22 29 L31 13"),
              "vgram_badge_j": ("J", "#D8DCE8", "#F2C94C", "M29 13 L29 25 Q29 31 22 29"),
              "vgram_badge_uzi": ("U", "#B58AFF", "#F2C94C", "M13 13 L13 24 Q13 31 22 29 L31 13"),
          }
          for name, (letter, hair, accent, glyph) in badge_specs.items():
              (drawable / (name + ".xml")).write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\\n'
                  '<vector xmlns:android="http://schemas.android.com/apk/res/android" '
                  'android:width="48dp" android:height="48dp" android:viewportWidth="44" android:viewportHeight="44">'
                  '<path android:fillColor="#101010" android:fillAlpha="0.82" android:pathData="M22,3 A19,19 0,1 0,22 41 A19,19 0,1 0,22 3"/>'
                  f'<path android:fillColor="{hair}" android:pathData="M9,17 C8,4 36,5 35,17 L31,14 L28,9 L20,13 L14,10 Z"/>'
                  f'<path android:fillColor="#00000000" android:strokeColor="{accent}" android:strokeWidth="3.1" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="{glyph.replace("M", "M", 1)}"/>'
                  f'<path android:fillColor="{accent}" android:pathData="M13.6,20 a2.4,2.4 0,1 0,4.8 0 a2.4,2.4 0,1 0,-4.8 0 M25.6,20 a2.4,2.4 0,1 0,4.8 0 a2.4,2.4 0,1 0,-4.8 0"/>'
                  '<path android:fillColor="#00000000" android:strokeColor="#D9D9D9" android:strokeWidth="1.2" android:pathData="M17,27 Q22,30 27,27"/>'
                  '</vector>', encoding="utf-8")
          print("Generated transparent-background N, V, J and Uzi badge vector resources.")

          # Integrate VGRAM entries into the real upstream SettingsActivity.
          settings = root / "TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java"
          source = settings.read_text(encoding="utf-8")
          list_anchor = '        items.add(SettingCell.Factory.of(19, IconBackgroundColors.GREEN.top, IconBackgroundColors.GREEN.bottom, R.drawable.settings_policy, getString(R.string.PrivacyPolicy)));'
          list_patch = list_anchor + '''
          items.add(SettingCell.Factory.of(27, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_chat, "VGRAM — Оформление", "Темы и цвета интерфейса"));
          items.add(SettingCell.Factory.of(28, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_features, "Обновления VGRAM", "Релизы и новые версии"));
          items.add(SettingCell.Factory.of(29, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_policy, "Разработчики", "Информация о проекте"));'''
          if source.count(list_anchor) != 1:
              raise SystemExit("VGRAM patch failed: SettingsActivity settings-list anchor changed")
          source = source.replace(list_anchor, list_patch, 1)
          # Regex matching avoids brittle whitespace / indentation mismatches.
          switch_pattern = r'(?s)(case 26:\s*\{\s*presentFragment\(new AudioRecorderSettingsActivity\(\)\);\s*break;\s*\})'
          switch_match = re.search(switch_pattern, source)
          if not switch_match:
              raise SystemExit("VGRAM patch failed: SettingsActivity case 26 handler not found")
          switch_patch = switch_match.group(1) + '''
            case 27: {
                presentFragment(new ThemeActivity(ThemeActivity.THEME_TYPE_BASIC));
                break;
            }
            case 28: {
                Browser.openUrl(getContext(), "https://github.com/ramzilzokirov-lgtm/VGRAM-Main/releases");
                break;
            }
            case 29: {
                Browser.openUrl(getContext(), "https://github.com/ramzilzokirov-lgtm/VGRAM-Main");
                break;
            }'''
          source = source[:switch_match.start(1)] + switch_patch + source[switch_match.end(1):]
          settings.write_text(source, encoding="utf-8")

          props = root / "gradle.properties"
          text = props.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^APP_VERSION_CODE=.*$', 'APP_VERSION_CODE=1', text)
          text = re.sub(r'(?m)^APP_VERSION_NAME=.*$', 'APP_VERSION_NAME=0.1', text)
          # CI memory limit is smaller than a developer workstation.
          text = re.sub(r'(?m)^org.gradle.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8', text)
          props.write_text(text, encoding="utf-8")

          buildvars = root / "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          text = buildvars.read_text(encoding="utf-8")
          text = re.sub(r'public static boolean CHECK_UPDATES = true;', 'public static boolean CHECK_UPDATES = false;', text, count=1)
          api_id = os.environ.get("TG_API_ID", "").strip()
          api_hash = os.environ.get("TG_API_HASH", "").strip()
          if api_id and api_hash:
              if not api_id.isdigit():
                  raise SystemExit("TG_API_ID must contain digits only")
              text = re.sub(r'public static int APP_ID = \d+;', f'public static int APP_ID = {api_id};', text, count=1)
              text = re.sub(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{api_hash}";', text, count=1)
          else:
              print("WARNING: TG_API_ID/TG_API_HASH secrets not both set; upstream development API values remain. Configure your own values before distribution.")
          buildvars.write_text(text, encoding="utf-8")
          PY

      - name: Validate VGRAM build patch before compiling
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java")
          s = p.read_text(encoding="utf-8")
          required = ['VGRAM — Оформление', 'Обновления VGRAM', 'Разработчики', 'case 27:', 'case 28:', 'case 29:']
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("VGRAM integration incomplete: " + ", ".join(missing))
          print("VGRAM settings entries and handlers are present.")
          PY

      - name: Build debug APK
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APK and build metadata
        if: always()
        run: |
          mkdir -p output
          find upstream/TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -exec cp {} output/VGRAM-debug.apk \; 2>/dev/null || true
          cp upstream-telegram-commit.txt output/ 2>/dev/null || true
          printf 'VGRAM version: 0.1\nBuild run: %s\n' "${GITHUB_RUN_NUMBER}" > output/build-info.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VGRAM-debug-apk
          path: output/
          if-no-files-found: error
          retention-days: 14
