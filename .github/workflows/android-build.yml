      - name: Prepare stable VGRAM signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore stable VGRAM signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vgram-debug-keystore-v1

      - name: Build debug APK
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APK and build metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t apks < <(find upstream/TMessagesProj_App/build/outputs/apk -type f -name "*.apk" 2>/dev/null | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: Gradle produced no APK files."
            exit 1
          fi
          selected=""
          for candidate in "${apks[@]}"; do
            if [[ "$candidate" == */afat/debug/*.apk ]]; then
              if [ -n "$selected" ]; then
                echo "ERROR: Multiple fat debug APKs found."
                printf '  %s\n' "$selected" "$candidate"
                exit 1
              fi
              selected="$candidate"
            fi
          done
          if [ -z "$selected" ]; then
            if [ "${#apks[@]}" -ne 1 ]; then
              echo "ERROR: Could not uniquely select the APK. Found:"
              printf '  %s\n' "${apks[@]}"
              exit 1
            fi
            selected="${apks[0]}"
          fi
          echo "Selected APK: $selected"
          cp "$selected" output/VGRAM-debug.apk
          cp upstream-telegram-commit.txt output/ 2>/dev/null || true
          VERSION="$(grep '^APP_VERSION_NAME=' upstream/gradle.properties | cut -d= -f2-)"
          (cd output && sha256sum VGRAM-debug.apk > VGRAM-debug.apk.sha256)
          printf 'VGRAM version: %s\nBuild run: %s\nSource APK: %s\n' "$VERSION" "${GITHUB_RUN_NUMBER}" "$selected" > output/build-info.txt

      - name: Validate APK before publishing
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="output/VGRAM-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "ERROR: Android SDK build-tools directory was not found."
            exit 1
          fi
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "ERROR: apksigner was not found in $BUILD_TOOLS"
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          if [ -x "$BUILD_TOOLS/aapt" ]; then
            "$BUILD_TOOLS/aapt" dump badging "$APK" | tee output/apk-badging.txt
          elif [ -x "$BUILD_TOOLS/aapt2" ]; then
            "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee output/apk-badging.txt
          else
            echo "ERROR: Neither aapt nor aapt2 is available."
            exit 1
          fi
          grep -Eq "^package: name='org\\.vgram\\.messenger(\\.beta)?'" output/apk-badging.txt || {
            echo "ERROR: APK package name is not an accepted VGRAM package (org.vgram.messenger or org.vgram.messenger.beta)."
            exit 1
          }
          echo "APK archive, Android package metadata, and signing verification passed."

      - name: Smoke test VGRAM startup in Android emulator
        if: success()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install output/VGRAM-debug.apk
            adb logcat -c
            adb shell monkey -p org.vgram.messenger 1
            sleep 20
            adb shell pidof org.vgram.messenger >/dev/null
            adb logcat -d -s AndroidRuntime:E | tee output/runtime-smoke-logcat.txt
            if grep -q "FATAL EXCEPTION" output/runtime-smoke-logcat.txt; then
              echo "ERROR: AndroidRuntime reported a fatal exception during startup smoke test."
              exit 1
            fi
            echo "VGRAM startup smoke test passed on Android API 32 emulator."

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VGRAM-debug-apk
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK for in-app OTA
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep '^APP_VERSION_NAME=' upstream/gradle.properties | cut -d= -f2-)"
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" output/VGRAM-debug.apk output/VGRAM-debug.apk.sha256 --title "VGRAM ${VERSION}" --notes "Automated VGRAM Android build ${VERSION}. SHA-256 checksum is published next to the APK."
          gh release upload "$TAG" output/VGRAM-debug.apk output/VGRAM-debug.apk.sha256 --clobber
