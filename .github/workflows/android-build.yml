name: VGRAM Android Build
# VGRAM source overlay includes player, profile rows, badge roles, and explicit launcher aliases

on:
  push:
    branches: [main, vgram-dev]
    paths:
      - ".github/workflows/android-build.yml"
      - "README.md"
      - "VGRAM_FEATURES.md"
      - "VGRAM_FULL_SPEC.md"
      - "PLUGIN_API.md"
      - "VGRAM_ICON.png"
      - "TELEGRAM_UPSTREAM_COMMIT.txt"
      - "TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/Cells/VgramGlassDrawable.java"
      - "scripts/patch_chat_message_cell.py"
      - "TMessagesProj/src/main/java/org/telegram/ui/Vgram*.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/VgramModules/**"
      - "TMessagesProj/src/main/java/org/telegram/ui/Components/ScrollSlidingTextTabStrip.java"
      - "TMessagesProj/src/main/java/org/telegram/messenger/Vgram*.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/TwoStepVerificationActivity.java"
      - "TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ThemeColors.java"
      - "TMessagesProj/src/main/java/org/telegram/messenger/VgramApiDiagnostics.java"
      - "TMessagesProj/src/main/java/org/telegram/messenger/VgramPremiumManager.java"
      - "TMessagesProj/src/main/AndroidManifest.xml"
      - "TMessagesProj/build.gradle"
      - "TMessagesProj/src/main/res/drawable/vgram_*.xml"
      - "TMessagesProj/src/main/res/values/strings.xml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vgram-android-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fetch Telegram source and build VGRAM
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout VGRAM build configuration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch clean Telegram Android source
        run: |
          UPSTREAM_COMMIT="$(tr -d '\r\n' < TELEGRAM_UPSTREAM_COMMIT.txt)"
          if [[ ! "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TELEGRAM_UPSTREAM_COMMIT.txt must contain a full 40-character commit SHA."
            exit 1
          fi
          git init upstream
          git -C upstream remote add origin https://github.com/DrKLO/Telegram.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream submodule update --init --recursive --depth 1
          git -C upstream rev-parse HEAD | tee upstream-telegram-commit.txt

      - name: Overlay committed VGRAM profile and resource sources
        run: |
          set -x
          # Explicit package directories make source overlays deterministic and auditable.
          mkdir -p upstream/TMessagesProj/src/main/java/org/telegram/ui/Cells
          mkdir -p upstream/TMessagesProj/src/main/java/org/telegram/ui
          mkdir -p upstream/TMessagesProj/src/main/java/org/telegram/messenger
          install -D TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java upstream/TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          test -s upstream/TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          test -s upstream/TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/VgramBadgesActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/VgramBadgesActivity.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/TwoStepVerificationActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/TwoStepVerificationActivity.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ThemeColors.java upstream/TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ThemeColors.java
          install -D TMessagesProj/src/main/java/org/telegram/messenger/VgramApiDiagnostics.java upstream/TMessagesProj/src/main/java/org/telegram/messenger/VgramApiDiagnostics.java
          install -D TMessagesProj/src/main/java/org/telegram/messenger/VgramPremiumManager.java upstream/TMessagesProj/src/main/java/org/telegram/messenger/VgramPremiumManager.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/VgramTheme.java upstream/TMessagesProj/src/main/java/org/telegram/ui/VgramTheme.java
          install -D TMessagesProj/src/main/java/org/telegram/ui/VgramBaseActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/VgramBaseActivity.java
          # Vgram*.java overlays are copied by the path-preserving find loop below.
          # Do not hard-code optional UI class paths here: absent files must not abort the build.
          mkdir -p upstream/TMessagesProj/src/main/java/org/telegram/messenger
          install -D TMessagesProj/src/main/java/org/telegram/messenger/VgramBadgeSync.java upstream/TMessagesProj/src/main/java/org/telegram/messenger/VgramBadgeSync.java
          test -s upstream/TMessagesProj/src/main/java/org/telegram/messenger/VgramBadgeSync.java

          # Keep the clean pinned upstream ChatMessageCell intact; its VGRAM indicator integration
          # is performed by the size-checked, idempotent patch_chat_message_cell.py step.

          # Overlay every committed Vgram*.java file while preserving its source-tree path.
          # This includes UI and messenger packages and prevents clean-upstream builds from
          # silently compiling against missing VGRAM classes.
          while IFS= read -r -d "" source_file; do
            relative="${source_file#TMessagesProj/src/main/java/}"
            install -D "$source_file" "upstream/TMessagesProj/src/main/java/$relative"
          done < <(find TMessagesProj/src/main/java -type f -name "Vgram*.java" -print0 | sort -z)

          # ChatMessageCell is intentionally kept as clean upstream source and patched in a
          # separate, validated step below. Never overlay a zero-byte marker over Telegram's class.
          cp -f TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java upstream/TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          cp -f TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java upstream/TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          grep -q "^package org.telegram.messenger;" upstream/TMessagesProj/src/main/java/org/telegram/messenger/VgramBadgeSync.java
          grep -q "public final class VgramBadgeSync" upstream/TMessagesProj/src/main/java/org/telegram/messenger/VgramBadgeSync.java
          grep -q "import org.telegram.messenger.VgramBadgeSync;" upstream/TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          grep -q "VgramBadgeSync.withBadges" upstream/TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java
          grep -q "VgramBadgeSync.apply(getParentActivity(), user.id, nameTextView\[a\])" upstream/TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          echo "Validated committed profile/dialog overlays and badge sync class."
          test -s upstream/TMessagesProj/src/main/java/org/telegram/messenger/VgramBadgeSync.java
          install -D TMessagesProj/src/main/AndroidManifest.xml upstream/TMessagesProj/src/main/AndroidManifest.xml
          install -D TMessagesProj/build.gradle upstream/TMessagesProj/build.gradle
          install -D TMessagesProj/src/main/res/values/strings.xml upstream/TMessagesProj/src/main/res/values/strings.xml
          for resource in vgram_settings_appearance vgram_settings_updates vgram_settings_developers vgram_settings_plugins vgram_settings_badges vgram_settings_privacy vgram_launcher_icon; do
            install -D "TMessagesProj/src/main/res/drawable/$resource.xml" "upstream/TMessagesProj/src/main/res/drawable/$resource.xml"
          done

          # Copy every committed launcher-icon resource into the clean upstream tree.
          # AndroidManifest references @mipmap/vgram_icon_01..10; without this overlay,
          # resource linking fails because the upstream checkout does not contain them.
          while IFS= read -r -d "" resource; do
            relative="${resource#TMessagesProj/src/main/res/}"
            install -D "$resource" "upstream/TMessagesProj/src/main/res/$relative"
          done < <(find TMessagesProj/src/main/res -type f \( -name "vgram_icon_*.xml" -o -name "vgram_icon_*.png" -o -name "vgram_icon_*.webp" \) -print0)

      - name: Integrate VGRAM indicators into clean upstream ChatMessageCell
        shell: bash
        run: |
          set -euxo pipefail
          target="upstream/TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"
          test -s "$target" || { echo "ERROR: upstream ChatMessageCell.java is missing or empty: $target"; exit 1; }
          python3 -X faulthandler scripts/patch_chat_message_cell.py "$target"
          grep -q "import org.telegram.messenger.VgramBadgeSync;" "$target"
          grep -q "VgramBadgeSync.drawInlineIndicators(canvas, this, currentMessageObject);" "$target"
          echo "ChatMessageCell VGRAM integration checks passed."
          # The pinned upstream revision may not expose currentBackgroundDrawable.draw(canvas).
          # The indicator integration is required; glass rendering is applied only when a safe draw hook exists.

      - name: Apply VGRAM bootstrap branding
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path("upstream")
          strings = root / "TMessagesProj/src/main/res/values/strings.xml"
          import xml.etree.ElementTree as ET
          strings_root = ET.parse(strings).getroot()
          required_strings = {
              "AppName": "VGRAM",
              "AppNameBeta": "VGRAM Beta",
              "VgramSettingsAppearance": "Оформление VGRAM",
              "VgramSettingsUpdates": "Обновления VGRAM",
              "VgramSettingsDevelopers": "Разработчики",
              "VgramSettingsPlugins": "Плагины VGRAM",
              "VgramSettingsBadges": "Бейджи VGRAM",
              "VgramSettingsPrivacy": "Политика конфиденциальности VGRAM",
              "VgramSettingsQuestions": "Вопросы о VGRAM",
              "VgramSettingsFeatures": "Возможности VGRAM",
          }
          actual_strings = {node.attrib.get("name"): "".join(node.itertext()) for node in strings_root.findall("string")}
          invalid_strings = [name for name, value in required_strings.items() if actual_strings.get(name) != value]
          if invalid_strings:
              raise SystemExit("Committed VGRAM string resources are missing or incorrect: " + ", ".join(invalid_strings))
          print("Validated committed VGRAM app name and settings string resources.")

          # Generate four transparent VGRAM character-style badge assets in the build tree.
          # SVG vector art is kept inside this single workflow file; no extra repository files needed.
          drawable = root / "TMessagesProj/src/main/res/drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          badge_specs = {
              "vgram_badge_n": ("N", "#D8DCE8", "#F2C94C", "M18 12 L30 28 L30 12"),
              "vgram_badge_v": ("V", "#D8DCE8", "#F2C94C", "M13 13 L22 29 L31 13"),
              "vgram_badge_j": ("J", "#D8DCE8", "#F2C94C", "M29 13 L29 25 Q29 31 22 29"),
              "vgram_badge_uzi": ("U", "#B58AFF", "#F2C94C", "M13 13 L13 24 Q13 31 22 29 L31 13"),
          }
          for name, (letter, hair, accent, glyph) in badge_specs.items():
              (drawable / (name + ".xml")).write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\\n'
                  '<vector xmlns:android="http://schemas.android.com/apk/res/android" '
                  'android:width="48dp" android:height="48dp" android:viewportWidth="44" android:viewportHeight="44">'                  f'<path android:fillColor="{hair}" android:pathData="M9,17 C8,4 36,5 35,17 L31,14 L28,9 L20,13 L14,10 Z"/>'
                  f'<path android:fillColor="#00000000" android:strokeColor="{accent}" android:strokeWidth="3.1" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="{glyph.replace("M", "M", 1)}"/>'
                  f'<path android:fillColor="{accent}" android:pathData="M13.6,20 a2.4,2.4 0,1 0,4.8 0 a2.4,2.4 0,1 0,-4.8 0 M25.6,20 a2.4,2.4 0,1 0,4.8 0 a2.4,2.4 0,1 0,-4.8 0"/>'
                  '<path android:fillColor="#00000000" android:strokeColor="#D9D9D9" android:strokeWidth="1.2" android:pathData="M17,27 Q22,30 27,27"/>'
                  '</vector>', encoding="utf-8")
          print("Generated transparent-background N, V, J and Uzi badge vector resources.")

          # Patch three resources referenced by current upstream Java but missing from its drawable tree.
          drawable_res = root / "TMessagesProj/src/main/res/drawable"
          drawable_res.mkdir(parents=True, exist_ok=True)
          (drawable_res / "preview_smile.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM8,9a1.5,1.5 0,1 1,0 3a1.5,1.5 0,1 1,0 -3zM16,9a1.5,1.5 0,1 1,0 3a1.5,1.5 0,1 1,0 -3zM7.5,14.5c1.1,1.8 2.6,2.7 4.5,2.7s3.4,-0.9 4.5,-2.7l-1.6,-0.8c-0.7,1.2 -1.7,1.8 -2.9,1.8s-2.2,-0.6 -2.9,-1.8z"/>
          </vector>
          """, encoding="utf-8")
          (drawable_res / "wallet_action_card_gradient.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="18dp"/>
              <gradient android:angle="45" android:startColor="#FF29251A" android:centerColor="#FF171717" android:endColor="#FF0D0D0D"/>
              <stroke android:width="1dp" android:color="#55C5B878"/>
          </shape>
          """, encoding="utf-8")
          (drawable_res / "wallet_card_diamond.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="256dp" android:height="256dp" android:viewportWidth="256" android:viewportHeight="256">
              <path android:fillColor="#FFF2D46A" android:pathData="M64,24L192,24L244,92L128,232L12,92Z"/>
              <path android:fillColor="#FFFAF2C7" android:pathData="M64,24L112,92L12,92Z"/>
              <path android:fillColor="#FFD4B447" android:pathData="M192,24L144,92L244,92Z"/>
              <path android:fillColor="#FFB89A35" android:pathData="M112,92L144,92L128,232Z"/>
              <path android:fillColor="#FFFFF4B0" android:pathData="M64,24L192,24L144,92L112,92Z"/>
          </vector>
          """, encoding="utf-8")
          print("Restored missing upstream resources: preview_smile, wallet_action_card_gradient, wallet_card_diamond.")

          # Restore every drawable named by the current upstream Java compile errors.
          compatibility_drawables = {
              "preview_back": """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFBDBDBD" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20z"/>
          </vector>
          """,
              "preview_mic": """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFBDBDBD" android:pathData="M12,14a3,3 0,0 0,3,-3V5a3,3 0,0 0,-6 0v6a3,3 0,0 0,3 3zM17,11a5,5 0,0 1,-10 0H5a7,7 0,0 0,6 6.93V21h2v-3.07A7,7 0,0 0,19 11z"/>
          </vector>
          """,
              "dino_pic": """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="64dp" android:height="64dp" android:viewportWidth="64" android:viewportHeight="64">
              <path android:fillColor="#FF83B56B" android:pathData="M12,42V27l8,-8h17l8,6h7v10h-8v8h-8v-7h-8v7h-8v-5z"/>
              <path android:fillColor="#FFB8D7A2" android:pathData="M20,22l4,-7h12l5,8z"/>
              <path android:fillColor="#FF263238" android:pathData="M34,25a3,3 0,1 0,6 0a3,3 0,1 0,-6 0"/>
              <path android:fillColor="#FFFFD166" android:pathData="M46,29h10l-4,5h-6z"/>
              <path android:fillColor="#FF5B8C4F" android:pathData="M12,42h8v8h-8zM36,42h8v8h-8z"/>
          </vector>
          """
          }
          for name, xml in compatibility_drawables.items():
              (drawable_res / (name + ".xml")).write_text(xml, encoding="utf-8")
          print("Restored additional compile-time drawables: preview_back, preview_mic, dino_pic.")

          # Original VGRAM icons for the custom settings rows (not Telegram's stock icons).
          vgram_icons = {
              "vgram_settings_appearance": "M12,2L14.5,8.5L21,11L14.5,13.5L12,20L9.5,13.5L3,11L9.5,8.5Z",
              "vgram_settings_updates": "M12,4V1L8,5L12,9V6C15.3,6 18,8.7 18,12C18,13 17.8,13.8 17.3,14.6L19.5,16.8C20.5,15.4 21,13.7 21,12C21,7 17,4 12,4ZM6,12C6,11 6.2,10.2 6.7,9.4L4.5,7.2C3.5,8.6 3,10.3 3,12C3,17 7,20 12,20V23L16,19L12,15V18C8.7,18 6,15.3 6,12Z",
              "vgram_settings_developers": "M12,2A4,4 0,1 0,12 10A4,4 0,1 0,12 2ZM4,20C4,15.6 7.6,12 12,12S20,15.6 20,20V22H4Z",
              "vgram_settings_plugins": "M10,2H14V6H18V10H22V14H18V18H14V22H10V18H6V14H2V10H6V6H10Z",
              "vgram_settings_badges": "M12,2L15,4L19,4L20,8L22,11L20,14L19,18L15,18L12,21L9,18L5,18L4,14L2,11L4,8L5,4L9,4Z M10,11L12,13L16,9L17.5,10.5L12,16L8.5,12.5Z",
              "vgram_settings_privacy": "M12,2L20,5V11C20,16 16.6,20 12,22C7.4,20 4,16 4,11V5Z M10,12L11.5,13.5L15,10L16.5,11.5L11.5,16.5L8.5,13.5Z"
          }
          for icon_name, path_data in vgram_icons.items():
              (drawable_res / (icon_name + ".xml")).write_text(
                  '<?xml version="1.0" encoding="utf-8"?>'
                  '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">'
                  f'<path android:fillColor="#FFFFFFFF" android:pathData="{path_data}"/>'
                  '</vector>', encoding="utf-8")
          print("Generated custom VGRAM icons for appearance, updates, developers, plugins, badges and privacy.")

          # Original VGRAM launcher mark: metallic face, violet hair and muted gold eyes.
          icon_xml = drawable / "vgram_launcher_icon.xml"
          icon_xml.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FF151619" android:pathData="M0,0 H108 V108 H0 Z"/>
              <path android:fillColor="#FF4B3D67" android:pathData="M17,47 L12,25 L31,33 L42,13 L53,30 L75,15 L72,36 L93,31 L82,51 L82,72 L68,91 L35,91 L22,74 Z"/>
              <path android:fillColor="#FFBFC3CF" android:pathData="M28,42 Q33,34 44,35 L67,35 Q78,38 79,50 L76,70 Q71,85 54,87 Q36,84 31,70 Z"/>
              <path android:fillColor="#FF6C588D" android:pathData="M27,42 L19,31 L36,35 L42,19 L50,34 L70,24 L68,39 L82,35 L75,50 L62,44 L45,43 Z"/>
              <path android:fillColor="#FFF2C94C" android:pathData="M35,52 L49,48 L47,59 L35,61 Z M59,48 L73,52 L72,61 L60,59 Z"/>
              <path android:fillColor="#FF24242A" android:pathData="M41,54 L45,53 L44,57 L40,58 Z M65,54 L69,55 L68,58 L64,57 Z"/>
              <path android:fillColor="#FF777B88" android:pathData="M45,70 Q54,76 64,70 L62,74 Q54,81 46,74 Z"/>
              <path android:fillColor="#00FFFFFF" android:strokeColor="#66C5B878" android:strokeWidth="1.3" android:pathData="M7,54 Q7,7 54,7 Q101,7 101,54 Q101,101 54,101 Q7,101 7,54 Z"/>
          </vector>
          """, encoding="utf-8")
          # AndroidManifest points to @drawable/vgram_launcher_icon, so place the vector
          # in drawable (not only drawable-nodpi) to satisfy resource linking.
          (drawable_res / "vgram_launcher_icon.xml").write_text(icon_xml.read_text(encoding="utf-8"), encoding="utf-8")
          # SettingsActivity is committed with VGRAM entries; no build-time Java patching.


          # Add native, fully branded VGRAM screens to the upstream Android application.
          ui_dir = root / "TMessagesProj/src/main/java/org/telegram/ui"
          ui_dir.mkdir(parents=True, exist_ok=True)
          # VgramTheme.java is committed under TMessagesProj and copied into the pinned upstream source.

          # Apply VGRAM colors on every launch and resume. Keep the hooks independent:
          # an existing onCreate hook must never prevent adding/fixing onResume.
          launch = root / "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
          launch_source = launch.read_text(encoding="utf-8")

          if not re.search(r"VgramTheme\.apply\(this\);", launch_source):
              launch_source, create_count = re.subn(
                  r'((?:public|protected)\s+void\s+onCreate\s*\(\s*Bundle\s+savedInstanceState\s*\)\s*\{[\s\S]*?super\.onCreate\(savedInstanceState\)\s*;)',
                  r'\1\n        VgramTheme.apply(this);',
                  launch_source,
                  count=1
              )
              if create_count != 1:
                  raise SystemExit("VGRAM theme integration failed: could not insert Vgram theme into LaunchActivity.onCreate")

