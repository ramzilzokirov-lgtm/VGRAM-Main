name: VGRAM Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "README.md"
      - "VGRAM_FEATURES.md"
      - "VGRAM_FULL_SPEC.md"
      - "PLUGIN_API.md"
      - "VGRAM_ICON.png"
      - "TELEGRAM_UPSTREAM_COMMIT.txt"

permissions:
  contents: write

concurrency:
  group: vgram-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fetch Telegram source and build VGRAM
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout VGRAM build configuration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch clean Telegram Android source
        run: |
          UPSTREAM_COMMIT="$(tr -d '\r\n' < TELEGRAM_UPSTREAM_COMMIT.txt)"
          if [[ ! "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TELEGRAM_UPSTREAM_COMMIT.txt must contain a full 40-character commit SHA."
            exit 1
          fi
          git init upstream
          git -C upstream remote add origin https://github.com/DrKLO/Telegram.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          git -C upstream submodule update --init --recursive --depth 1
          git -C upstream rev-parse HEAD | tee upstream-telegram-commit.txt

      - name: Apply VGRAM bootstrap branding
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path("upstream")
          strings = root / "TMessagesProj/src/main/res/values/strings.xml"
          text = strings.read_text(encoding="utf-8")
          text = re.sub(r'(<string\s+name="AppName">).*?(</string>)', r'\1VGRAM\2', text, count=1)
          text = re.sub(r'(<string\s+name="AppNameBeta">).*?(</string>)', r'\1VGRAM Beta\2', text, count=1)
          strings.write_text(text, encoding="utf-8")

          # Generate four transparent VGRAM character-style badge assets in the build tree.
          # SVG vector art is kept inside this single workflow file; no extra repository files needed.
          drawable = root / "TMessagesProj/src/main/res/drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          badge_specs = {
              "vgram_badge_n": ("N", "#D8DCE8", "#F2C94C", "M18 12 L30 28 L30 12"),
              "vgram_badge_v": ("V", "#D8DCE8", "#F2C94C", "M13 13 L22 29 L31 13"),
              "vgram_badge_j": ("J", "#D8DCE8", "#F2C94C", "M29 13 L29 25 Q29 31 22 29"),
              "vgram_badge_uzi": ("U", "#B58AFF", "#F2C94C", "M13 13 L13 24 Q13 31 22 29 L31 13"),
          }
          for name, (letter, hair, accent, glyph) in badge_specs.items():
              (drawable / (name + ".xml")).write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\\n'
                  '<vector xmlns:android="http://schemas.android.com/apk/res/android" '
                  'android:width="48dp" android:height="48dp" android:viewportWidth="44" android:viewportHeight="44">'
                  f'<path android:fillColor="{hair}" android:pathData="M9,17 C8,4 36,5 35,17 L31,14 L28,9 L20,13 L14,10 Z"/>'
                  f'<path android:fillColor="#00000000" android:strokeColor="{accent}" android:strokeWidth="3.1" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="{glyph.replace("M", "M", 1)}"/>'
                  f'<path android:fillColor="{accent}" android:pathData="M13.6,20 a2.4,2.4 0,1 0,4.8 0 a2.4,2.4 0,1 0,-4.8 0 M25.6,20 a2.4,2.4 0,1 0,4.8 0 a2.4,2.4 0,1 0,-4.8 0"/>'
                  '<path android:fillColor="#00000000" android:strokeColor="#D9D9D9" android:strokeWidth="1.2" android:pathData="M17,27 Q22,30 27,27"/>'
                  '</vector>', encoding="utf-8")
          print("Generated transparent-background N, V, J and Uzi badge vector resources.")

          # Patch three resources referenced by current upstream Java but missing from its drawable tree.
          drawable_res = root / "TMessagesProj/src/main/res/drawable"
          drawable_res.mkdir(parents=True, exist_ok=True)
          (drawable_res / "preview_smile.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM8,9a1.5,1.5 0,1 1,0 3a1.5,1.5 0,1 1,0 -3zM16,9a1.5,1.5 0,1 1,0 3a1.5,1.5 0,1 1,0 -3zM7.5,14.5c1.1,1.8 2.6,2.7 4.5,2.7s3.4,-0.9 4.5,-2.7l-1.6,-0.8c-0.7,1.2 -1.7,1.8 -2.9,1.8s-2.2,-0.6 -2.9,-1.8z"/>
          </vector>
          """, encoding="utf-8")
          (drawable_res / "wallet_action_card_gradient.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="18dp"/>
              <gradient android:angle="45" android:startColor="#FF29251A" android:centerColor="#FF171717" android:endColor="#FF0D0D0D"/>
              <stroke android:width="1dp" android:color="#55C5B878"/>
          </shape>
          """, encoding="utf-8")
          (drawable_res / "wallet_card_diamond.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="256dp" android:height="256dp" android:viewportWidth="256" android:viewportHeight="256">
              <path android:fillColor="#FFF2D46A" android:pathData="M64,24L192,24L244,92L128,232L12,92Z"/>
              <path android:fillColor="#FFFAF2C7" android:pathData="M64,24L112,92L12,92Z"/>
              <path android:fillColor="#FFD4B447" android:pathData="M192,24L144,92L244,92Z"/>
              <path android:fillColor="#FFB89A35" android:pathData="M112,92L144,92L128,232Z"/>
              <path android:fillColor="#FFFFF4B0" android:pathData="M64,24L192,24L144,92L112,92Z"/>
          </vector>
          """, encoding="utf-8")
          print("Restored missing upstream resources: preview_smile, wallet_action_card_gradient, wallet_card_diamond.")

          # Restore every drawable named by the current upstream Java compile errors.
          compatibility_drawables = {
              "preview_back": """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFBDBDBD" android:pathData="M20,11H7.83l5.59,-5.59L12,4l-8,8 8,8 1.41,-1.41L7.83,13H20z"/>
          </vector>
          """,
              "preview_mic": """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFBDBDBD" android:pathData="M12,14a3,3 0,0 0,3,-3V5a3,3 0,0 0,-6 0v6a3,3 0,0 0,3 3zM17,11a5,5 0,0 1,-10 0H5a7,7 0,0 0,6 6.93V21h2v-3.07A7,7 0,0 0,19 11z"/>
          </vector>
          """,
              "dino_pic": """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="64dp" android:height="64dp" android:viewportWidth="64" android:viewportHeight="64">
              <path android:fillColor="#FF83B56B" android:pathData="M12,42V27l8,-8h17l8,6h7v10h-8v8h-8v-7h-8v7h-8v-5z"/>
              <path android:fillColor="#FFB8D7A2" android:pathData="M20,22l4,-7h12l5,8z"/>
              <path android:fillColor="#FF263238" android:pathData="M34,25a3,3 0,1 0,6 0a3,3 0,1 0,-6 0"/>
              <path android:fillColor="#FFFFD166" android:pathData="M46,29h10l-4,5h-6z"/>
              <path android:fillColor="#FF5B8C4F" android:pathData="M12,42h8v8h-8zM36,42h8v8h-8z"/>
          </vector>
          """
          }
          for name, xml in compatibility_drawables.items():
              (drawable_res / (name + ".xml")).write_text(xml, encoding="utf-8")
          print("Restored additional compile-time drawables: preview_back, preview_mic, dino_pic.")

          # Original VGRAM launcher mark: metallic face, violet hair and muted gold eyes.
          icon_xml = drawable / "vgram_launcher_icon.xml"
          icon_xml.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FF151619" android:pathData="M0,0 H108 V108 H0 Z"/>
              <path android:fillColor="#FF4B3D67" android:pathData="M17,47 L12,25 L31,33 L42,13 L53,30 L75,15 L72,36 L93,31 L82,51 L82,72 L68,91 L35,91 L22,74 Z"/>
              <path android:fillColor="#FFBFC3CF" android:pathData="M28,42 Q33,34 44,35 L67,35 Q78,38 79,50 L76,70 Q71,85 54,87 Q36,84 31,70 Z"/>
              <path android:fillColor="#FF6C588D" android:pathData="M27,42 L19,31 L36,35 L42,19 L50,34 L70,24 L68,39 L82,35 L75,50 L62,44 L45,43 Z"/>
              <path android:fillColor="#FFF2C94C" android:pathData="M35,52 L49,48 L47,59 L35,61 Z M59,48 L73,52 L72,61 L60,59 Z"/>
              <path android:fillColor="#FF24242A" android:pathData="M41,54 L45,53 L44,57 L40,58 Z M65,54 L69,55 L68,58 L64,57 Z"/>
              <path android:fillColor="#FF777B88" android:pathData="M45,70 Q54,76 64,70 L62,74 Q54,81 46,74 Z"/>
              <path android:fillColor="#00FFFFFF" android:strokeColor="#66C5B878" android:strokeWidth="1.3" android:pathData="M7,54 Q7,7 54,7 Q101,7 101,54 Q101,101 54,101 Q7,101 7,54 Z"/>
          </vector>
          """, encoding="utf-8")
          # AndroidManifest points to @drawable/vgram_launcher_icon, so place the vector
          # in drawable (not only drawable-nodpi) to satisfy resource linking.
          (drawable_res / "vgram_launcher_icon.xml").write_text(icon_xml.read_text(encoding="utf-8"), encoding="utf-8")

          # Integrate VGRAM entries into the real upstream SettingsActivity.
          settings = root / "TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java"
          source = settings.read_text(encoding="utf-8")

          # Replace Telegram-branded help links with VGRAM-owned screens and remove "Ask a Question".
          ask_row = '        items.add(SettingCell.Factory.of(17, IconBackgroundColors.ORANGE.top, IconBackgroundColors.ORANGE.bottom, R.drawable.settings_ask, getString(R.string.AskAQuestion)));'
          faq_row = '        items.add(SettingCell.Factory.of(18, IconBackgroundColors.BLUE_LIGHT.top, IconBackgroundColors.BLUE_LIGHT.bottom, R.drawable.settings_faq, getString(R.string.TelegramFAQ)));'
          features_row = '        items.add(SettingCell.Factory.of(23, IconBackgroundColors.PURPLE.top, IconBackgroundColors.PURPLE.bottom, R.drawable.settings_features, getString(R.string.TelegramFeatures)));'
          if source.count(ask_row) != 1 or source.count(faq_row) != 1 or source.count(features_row) != 1:
              raise SystemExit("VGRAM help-menu patch failed: upstream help rows changed")
          source = source.replace(ask_row, "", 1)
          source = source.replace(faq_row, '        items.add(SettingCell.Factory.of(18, IconBackgroundColors.BLUE_LIGHT.top, IconBackgroundColors.BLUE_LIGHT.bottom, R.drawable.settings_faq, "Вопросы о VGRAM"));', 1)
          source = source.replace(features_row, '        items.add(SettingCell.Factory.of(23, IconBackgroundColors.PURPLE.top, IconBackgroundColors.PURPLE.bottom, R.drawable.settings_features, "Возможности VGRAM"));', 1)
          faq_handler = '                Browser.openUrl(getParentActivity(), LocaleController.getString(R.string.TelegramFaqUrl));'
          if source.count(faq_handler) != 1:
              raise SystemExit("VGRAM help-menu patch failed: FAQ handler changed")
          source = source.replace(faq_handler, '                getParentActivity().startActivity(new Intent(getParentActivity(), VgramQuestionsActivity.class));', 1)
          feature_pattern = r'(?s)case 23:\s*\{.*?\n\s*\}\s*(?=\n\s*case 24:)'
          feature_replacement = '''case 23: {
                getParentActivity().startActivity(new Intent(getParentActivity(), VgramFeaturesActivity.class));
                break;
            }'''
          source, feature_count = re.subn(feature_pattern, feature_replacement, source, count=1)
          if feature_count != 1:
              raise SystemExit("VGRAM help-menu patch failed: could not locate case 23 before case 24")

          list_anchor = '        items.add(SettingCell.Factory.of(19, IconBackgroundColors.GREEN.top, IconBackgroundColors.GREEN.bottom, R.drawable.settings_policy, getString(R.string.PrivacyPolicy)));'
          list_patch = list_anchor + '''
          items.add(SettingCell.Factory.of(27, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_chat, "Оформление VGRAM", "Темы, цвета и внешний вид"));
          items.add(SettingCell.Factory.of(28, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_features, "Обновления VGRAM", "Релизы и новые версии"));
          items.add(SettingCell.Factory.of(29, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_policy, "Разработчики", "Информация о проекте"));
          items.add(SettingCell.Factory.of(30, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_features, "Плагины VGRAM", "Управление установленными расширениями"));
          items.add(SettingCell.Factory.of(31, 0xFFC5B878, 0xFF9E914C, R.drawable.settings_policy, "Бейджи VGRAM", "TESTER · OG · FRIENDS · TEAM"));'''
          if source.count(list_anchor) != 1:
              raise SystemExit("VGRAM patch failed: SettingsActivity settings-list anchor changed")
          source = source.replace(list_anchor, list_patch, 1)
          # Regex matching avoids brittle whitespace / indentation mismatches.
          switch_pattern = r'(?s)(case 26:\s*\{\s*presentFragment\(new AudioRecorderSettingsActivity\(\)\);\s*break;\s*\})'
          switch_match = re.search(switch_pattern, source)
          if not switch_match:
              raise SystemExit("VGRAM patch failed: SettingsActivity case 26 handler not found")
          switch_patch = switch_match.group(1) + '''
            case 27: {
                getParentActivity().startActivity(new Intent(getParentActivity(), VgramSettingsActivity.class));
                break;
            }
            case 28: {
                getParentActivity().startActivity(new Intent(getParentActivity(), VgramUpdateActivity.class));
                break;
            }
            case 29: {
                getParentActivity().startActivity(new Intent(getParentActivity(), VgramDevelopersActivity.class));
                break;
            }
            case 30: {
                getParentActivity().startActivity(new Intent(getParentActivity(), VgramPluginsActivity.class));
                break;
            }
            case 31: {
                getParentActivity().startActivity(new Intent(getParentActivity(), VgramBadgesActivity.class));
                break;
            }'''
          source = source[:switch_match.start(1)] + switch_patch + source[switch_match.end(1):]
          settings.write_text(source, encoding="utf-8")

          # Add native, fully branded VGRAM screens to the upstream Android application.
          ui_dir = root / "TMessagesProj/src/main/java/org/telegram/ui"
          ui_dir.mkdir(parents=True, exist_ok=True)
          (ui_dir / "VgramTheme.java").write_text(r'''package org.telegram.ui;

          import android.content.Context;
          import org.telegram.messenger.NotificationCenter;
          import org.telegram.ui.ActionBar.Theme;

          public final class VgramTheme {
              private VgramTheme() {}
              public static int accent(Context context) {
                  return context.getSharedPreferences("vgram_ui", Context.MODE_PRIVATE).getInt("accent", 0xffc5b878);
              }
              public static void apply(Context context) {
                  int a = accent(context);
                  // Apply a muted brown/amber palette inspired by the requested YouGram references.
                  Theme.setColor(Theme.key_windowBackgroundWhite, 0xff17100c, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteBlackText, 0xfff5eee7, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteGrayText, 0xffc8bdb2, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteGrayText2, 0xffaaa096, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteHintText, 0xffa99c90, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteInputField, 0xff30251d, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteInputFieldActivated, a, false);
                  Theme.setColor(Theme.key_dialogBackground, 0xff211810, false);
                  Theme.setColor(Theme.key_dialogBackgroundGray, 0xff19130f, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteBlueText, a, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteBlueText2, a, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteBlueIcon, a, false);
                  Theme.setColor(Theme.key_windowBackgroundWhiteBlueButton, a, false);
                  Theme.setColor(Theme.key_actionBarDefault, 0xff151619, false);
                  Theme.setColor(Theme.key_actionBarDefaultIcon, 0xffe5e4dd, false);
                  Theme.setColor(Theme.key_actionBarDefaultTitle, 0xfff0f0ec, false);
                  Theme.setColor(Theme.key_chats_unreadCounter, a, false);
                  Theme.setColor(Theme.key_chats_nameMessage, a, false);
                  Theme.setColor(Theme.key_chat_outBubble, blend(a, 0xff222326, 0.30f), false);
                  NotificationCenter.getGlobalInstance().postNotificationName(NotificationCenter.needCheckSystemBarColors);
              }
              private static int blend(int foreground, int background, float amount) {
                  int r = (int) (android.graphics.Color.red(foreground) * amount + android.graphics.Color.red(background) * (1f - amount));
                  int g = (int) (android.graphics.Color.green(foreground) * amount + android.graphics.Color.green(background) * (1f - amount));
                  int b = (int) (android.graphics.Color.blue(foreground) * amount + android.graphics.Color.blue(background) * (1f - amount));
                  return android.graphics.Color.rgb(r, g, b);
              }
          }
          ''', encoding="utf-8")

          # Apply VGRAM colors on every launch and resume. Keep the hooks independent:
          # an existing onCreate hook must never prevent adding/fixing onResume.
          launch = root / "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
          launch_source = launch.read_text(encoding="utf-8")

          if not re.search(r"VgramTheme\\.apply\\(this\\);", launch_source):
              launch_source, create_count = re.subn(
                  r'((?:public|protected)\\s+void\\s+onCreate\\s*\\(\\s*Bundle\\s+savedInstanceState\\s*\\)\\s*\\{[\\s\\S]*?super\\.onCreate\\(savedInstanceState\\)\\s*;)',
                  r'\\1\\n        VgramTheme.apply(this);',
                  launch_source,
                  count=1
              )
              if create_count != 1:
                  raise SystemExit("VGRAM theme integration failed: could not insert Vgram theme into LaunchActivity.onCreate")

          # Check the onResume method specifically, not the entire file after the first occurrence.
          resume_match = re.search(r'((?:public|protected)\\s+void\\s+onResume\\s*\\(\\s*\\)\\s*\\{[\\s\\S]*?super\\.onResume\\(\\)\\s*;)', launch_source)
          if resume_match:
              resume_body = resume_match.group(1)
              if "VgramTheme.apply(this);" not in resume_body:
                  launch_source = launch_source[:resume_match.end(1)] + "\\n        VgramTheme.apply(this);" + launch_source[resume_match.end(1):]
          else:
              raise SystemExit("VGRAM theme integration failed: could not find LaunchActivity.onResume")

          launch.write_text(launch_source, encoding="utf-8")
          print("Verified VGRAM theme hooks in LaunchActivity.onCreate and onResume.")

          (ui_dir / "VgramBaseActivity.java").write_text(r'''package org.telegram.ui;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          abstract class VgramBaseActivity extends Activity {
              protected LinearLayout body;
              protected int accent() { return VgramTheme.accent(this); }
              protected int dp(float value) { return (int) (value * getResources().getDisplayMetrics().density + 0.5f); }

              @Override protected void onCreate(Bundle state) { super.onCreate(state); }

              protected void setupScreen(String eyebrow, String title, String subtitle) {
                  getWindow().setStatusBarColor(0xff17100c);
                  getWindow().setNavigationBarColor(0xff17100c);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR,
            new int[] { 0xff261a13, 0xff17100c, 0xff21170f }));
                  root.setPadding(dp(18), dp(10), dp(18), dp(14));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  TextView back = label("‹", 31, 0xfff0f0ec, true);
                  back.setGravity(Gravity.CENTER);
                  back.setBackground(panel(0xff35241a, accent(), 18));
                  header.addView(back, new LinearLayout.LayoutParams(dp(48), dp(46)));
                  back.setOnClickListener(v -> finish());

                  LinearLayout brand = new LinearLayout(this);
                  brand.setOrientation(LinearLayout.VERTICAL);
                  brand.setPadding(dp(13), 0, 0, 0);
                  brand.addView(label("VGRAM", 11, accent(), true));
                  brand.addView(label(eyebrow, 10, 0xffc8bdb2, true));
                  header.addView(brand, new LinearLayout.LayoutParams(0, -2, 1));
                  root.addView(header, new LinearLayout.LayoutParams(-1, -2));

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(false);
                  scroll.setClipToPadding(false);
                  scroll.setPadding(0, dp(12), 0, dp(8));
                  body = new LinearLayout(this);
                  body.setOrientation(LinearLayout.VERTICAL);
                  TextView heading = label(title, 29, 0xfff2f1ec, true);
                  body.addView(heading, margin(0, 0, 0, 7));
                  TextView description = label(subtitle, 14, 0xffa4a49f, false);
                  description.setLineSpacing(dp(3), 1f);
                  body.addView(description, margin(0, 0, 0, 19));
                  scroll.addView(body, new ScrollView.LayoutParams(-1, -2));
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
                  TextView footer = label("VGRAM  •  TELEGRAM NETWORK", 10, 0xff67696d, true);
                  footer.setGravity(Gravity.CENTER);
                  root.addView(footer, margin(0, dp(5), 0, 0));
                  setContentView(root);
              }

              protected LinearLayout card(String title, String description) {
                  boolean glass = getSharedPreferences("vgram_ui", MODE_PRIVATE).getBoolean("glass", true);
                  int fill = glass ? 0xe51e2024 : 0xff1e2024;
                  int stroke = Color.argb(glass ? 92 : 45, Color.red(accent()), Color.green(accent()), Color.blue(accent()));
                  com.google.android.material.card.MaterialCardView surface = new com.google.android.material.card.MaterialCardView(this);
                  surface.setCardBackgroundColor(fill);
                  surface.setRadius(dp(24));
                  surface.setStrokeColor(stroke);
                  surface.setStrokeWidth(dp(1));
                  surface.setCardElevation(dp(1));
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(17), dp(17), dp(17), dp(17));
                  surface.addView(card);
                  card.addView(label(title, 16, 0xfff1f0eb, true), margin(0, 0, 0, 7));
