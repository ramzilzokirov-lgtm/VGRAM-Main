          # VgramQuestionsActivity.java is committed under TMessagesProj and copied into the pinned upstream source.

          # VgramFeaturesActivity.java is committed under TMessagesProj and copied into the pinned upstream source.

          # VgramPrivacyActivity.java is committed under TMessagesProj and copied into the pinned upstream source.

          # Register internal screens. Upstream already provides FileProvider and REQUEST_INSTALL_PACKAGES.
          manifest = root / "TMessagesProj/src/main/AndroidManifest.xml"
          manifest_text = manifest.read_text(encoding="utf-8")
          app_end = "    </application>"
          screen_declarations = """        <activity android:name="org.telegram.ui.VgramSettingsActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramPrivacyActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramUpdateActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramDevelopersActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramPluginsActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramBadgesActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramQuestionsActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramFeaturesActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          <activity android:name="org.telegram.ui.VgramBannerCropActivity" android:exported="false" android:theme="@style/Theme.Material3.DayNight.NoActionBar" />
          """
          manifest_text = re.sub(r'android:icon="@mipmap/icon_[0-9]+_launcher"', 'android:icon="@drawable/vgram_launcher_icon"', manifest_text)
          if "org.telegram.ui.VgramBadgesActivity" not in manifest_text:
              if manifest_text.count(app_end) != 1:
                  raise SystemExit("VGRAM patch failed: AndroidManifest application closing tag changed")
              manifest_text = manifest_text.replace(app_end, screen_declarations + app_end, 1)
              manifest.write_text(manifest_text, encoding="utf-8")

          launch = root / "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
