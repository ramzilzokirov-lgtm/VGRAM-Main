name: VGRAM Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "README.md"
      - "VGRAM_FEATURES.md"
      - "PLUGIN_API.md"

permissions:
  contents: read

concurrency:
  group: vgram-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fetch Telegram source and build VGRAM
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout VGRAM build configuration
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch clean Telegram Android source
        run: |
          git clone --recursive --shallow-submodules --depth 1 https://github.com/DrKLO/Telegram.git upstream
          cd upstream
          git rev-parse HEAD | tee ../upstream-telegram-commit.txt

      - name: Apply VGRAM bootstrap branding
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path("upstream")
          strings = root / "TMessagesProj/src/main/res/values/strings.xml"
          text = strings.read_text(encoding="utf-8")
          text = re.sub(r'(<string\s+name="AppName">).*?(</string>)', r'\1VGRAM\2', text, count=1)
          text = re.sub(r'(<string\s+name="AppNameBeta">).*?(</string>)', r'\1VGRAM Beta\2', text, count=1)
          strings.write_text(text, encoding="utf-8")

          # Add a visible VGRAM appearance entry to the existing profile/settings list.
          profile = root / "TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java"
          ptext = profile.read_text(encoding="utf-8")
          def replace_once(old, new, label):
              global ptext
              if old not in ptext:
                  raise SystemExit("Could not apply VGRAM UI patch: " + label)
              ptext = ptext.replace(old, new, 1)
          replace_once("    private int privacyRow;", "    private int privacyRow;\n    private int vgramAppearanceRow;", "appearance row field")
          replace_once("            } else if (position == privacyRow) {\n                presentFragment(new PrivacySettingsActivity().setCurrentPassword(currentPassword));", "            } else if (position == vgramAppearanceRow) {\n                presentFragment(new ThemeActivity(ThemeActivity.THEME_TYPE_BASIC));\n            } else if (position == privacyRow) {\n                presentFragment(new PrivacySettingsActivity().setCurrentPassword(currentPassword));", "appearance click handler")
          replace_once("                chatRow = rowCount++;\n                privacyRow = rowCount++;", "                chatRow = rowCount++;\n                vgramAppearanceRow = rowCount++;\n                privacyRow = rowCount++;", "appearance row placement")
          replace_once("                    } else if (position == privacyRow) {\n                        textCell.setTextAndIcon(LocaleController.getString(R.string.PrivacyPolicy), R.drawable.msg2_policy, false);", "                    } else if (position == vgramAppearanceRow) {\n                        textCell.setTextAndIcon(\"VGRAM: Оформление\", R.drawable.msg2_settings, true);\n                    } else if (position == privacyRow) {\n                        textCell.setTextAndIcon(LocaleController.getString(R.string.PrivacyPolicy), R.drawable.msg2_policy, false);", "appearance row label")
          replace_once("return position == notificationRow || position == numberRow || position == privacyRow ||", "return position == notificationRow || position == numberRow || position == privacyRow || position == vgramAppearanceRow ||", "appearance row enabled state")
          profile.write_text(ptext, encoding="utf-8")

          props = root / "gradle.properties"
          text = props.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^APP_VERSION_CODE=.*$', 'APP_VERSION_CODE=1', text)
          text = re.sub(r'(?m)^APP_VERSION_NAME=.*$', 'APP_VERSION_NAME=0.1', text)
          # CI memory limit is smaller than a developer workstation.
          text = re.sub(r'(?m)^org.gradle.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8', text)
          props.write_text(text, encoding="utf-8")

          buildvars = root / "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          text = buildvars.read_text(encoding="utf-8")
          text = re.sub(r'public static boolean CHECK_UPDATES = true;', 'public static boolean CHECK_UPDATES = false;', text, count=1)
          api_id = os.environ.get("TG_API_ID", "").strip()
          api_hash = os.environ.get("TG_API_HASH", "").strip()
          if api_id and api_hash:
              if not api_id.isdigit():
                  raise SystemExit("TG_API_ID must contain digits only")
              text = re.sub(r'public static int APP_ID = \d+;', f'public static int APP_ID = {api_id};', text, count=1)
              text = re.sub(r'public static String APP_HASH = "[^"]*";', f'public static String APP_HASH = "{api_hash}";', text, count=1)
          else:
              print("WARNING: TG_API_ID/TG_API_HASH secrets not both set; upstream development API values remain. Configure your own values before distribution.")
          buildvars.write_text(text, encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: upstream
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APK and build metadata
        if: always()
        run: |
          mkdir -p output
          find upstream/TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -exec cp {} output/VGRAM-debug.apk \; 2>/dev/null || true
          cp upstream-telegram-commit.txt output/ 2>/dev/null || true
          printf 'VGRAM version: 0.1\nBuild run: %s\n' "${GITHUB_RUN_NUMBER}" > output/build-info.txt

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VGRAM-debug-apk
          path: output/
          if-no-files-found: error
          retention-days: 14
